services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL}
    container_name: project_frontend
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - backend
